[General]
network = WiredAndWirelessHostsWithAP
sim-time-limit = 40s
seed-set = 220041122

*.radioMedium.typename = "RadioMedium"
*.radioMedium.backgroundNoise.power = -110dBm

*.wirelessHost[*].wlan[0].radio.typename = "Radio"
*.wirelessHost[*].wlan[0].radio.errorModel.typename = "Ieee80211YansErrorModel"

*.wirelessHost[*].mobility.typename = "StationaryMobility"
*.wirelessHost[*].mobility.constraintAreaMinX = 0m
*.wirelessHost[*].mobility.constraintAreaMinY = 0m
*.wirelessHost[*].mobility.constraintAreaMaxX = 400m
*.wirelessHost[*].mobility.constraintAreaMaxY = 400m

*.wiredSinkNode.numApps = 1
*.wiredSinkNode.app[0].typename = "UdpSink"
*.wiredSinkNode.app[0].localPort = 5000


[Config Task1_Saturation]
*.numWirelessHosts = ${N=2,4,8,12,16,20}
*.numWiredHosts = 0

*.wirelessHost[*].wlan[0].mac.dcf.cwMin = ${CW=15,31,63}

*.wirelessHost[*].numApps = 1
*.wirelessHost[*].app[0].typename = "UdpBasicApp"
*.wirelessHost[*].app[0].destAddresses = "wiredSinkNode"
*.wirelessHost[*].app[0].destPort = 5000
*.wirelessHost[*].app[0].messageLength = 1000Byte
*.wirelessHost[*].app[0].sendInterval = ${Interval=0.005s,0.001s}
*.wirelessHost[*].app[0].startTime = 1s


[Config Task2_Interference]
*.numWirelessHosts = 10
*.numWiredHosts = 0

*.radioMedium.backgroundNoise.power = ${Noise=-105dBm,-100dBm,-95dBm,-90dBm,-85dBm,-80dBm,-75dBm}

*.wirelessHost[*].wlan[0].mac.dcf.cwMin = 15

*.wirelessHost[*].numApps = 1
*.wirelessHost[*].app[0].typename = "UdpBasicApp"
*.wirelessHost[*].app[0].destAddresses = "wiredSinkNode"
*.wirelessHost[*].app[0].destPort = 5000
*.wirelessHost[*].app[0].messageLength = 1000Byte
*.wirelessHost[*].app[0].sendInterval = 0.002s
*.wirelessHost[*].app[0].startTime = 1s


[Config Task3_Wireless_Saturation]
*.numWirelessHosts = 20
*.numWiredHosts = 0

*.wirelessHost[*].wlan[0].mac.dcf.cwMin = 15

*.wirelessHost[*].numApps = 1
*.wirelessHost[*].app[0].typename = "UdpBasicApp"
*.wirelessHost[*].app[0].destAddresses = "wiredSinkNode"
*.wirelessHost[*].app[0].destPort = 5000
*.wirelessHost[*].app[0].messageLength = 1000Byte
*.wirelessHost[*].app[0].sendInterval = ${Interval=0.0017778s,0.0016s,0.0014545s}
*.wirelessHost[*].app[0].startTime = 1s


[Config Task3_Wired_Saturation]
*.numWirelessHosts = 0
*.numWiredHosts = 20

*.wiredHost[*].numApps = 1
*.wiredHost[*].app[0].typename = "UdpBasicApp"
*.wiredHost[*].app[0].destAddresses = "wiredSinkNode"
*.wiredHost[*].app[0].destPort = 5000
*.wiredHost[*].app[0].messageLength = 1000Byte
*.wiredHost[*].app[0].sendInterval = ${Interval=0.0017778s,0.0016s,0.0014545s}
*.wiredHost[*].app[0].startTime = 1s